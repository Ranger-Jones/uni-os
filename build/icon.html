<!doctype html>
<html><head><style>
html,body{margin:0;width:1024px;height:1024px;background:transparent;overflow:hidden}
</style></head><body>
<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f1f0ec"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.22"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px body centered -->
  <g filter="url(#shadow)">
    <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#paper)"/>
  </g>
  <!-- register tabs on the right edge -->
  <rect x="770" y="250" width="70" height="120" rx="18" fill="#3f72c9"/>
  <rect x="770" y="390" width="70" height="120" rx="18" fill="#4b9a6a"/>
  <rect x="770" y="530" width="70" height="120" rx="18" fill="#d9822b"/>
  <rect x="770" y="670" width="70" height="120" rx="18" fill="#8a63c9"/>
  <!-- page -->
  <rect x="200" y="200" width="590" height="640" rx="40" fill="#ffffff" stroke="#e2e1dc" stroke-width="6"/>
  <!-- ring binding -->
  <g fill="none" stroke="#2f3437" stroke-width="16" stroke-linecap="round">
    <path d="M200 300 h-36"/><path d="M200 420 h-36"/><path d="M200 540 h-36"/><path d="M200 660 h-36"/><path d="M200 780 h-36"/>
  </g>
  <!-- serif U -->
  <text x="495" y="640" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="400" font-weight="700" fill="#2e5aac">U</text>
  <rect x="300" y="700" width="390" height="16" rx="8" fill="#e7e7e4"/>
  <rect x="300" y="740" width="270" height="16" rx="8" fill="#e7e7e4"/>
</svg>
</body></html>
