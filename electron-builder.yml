appId: de.eventings.unios
productName: UniOS
copyright: Copyright © 2026
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
asarUnpack:
  - "**/*.node"
npmRebuild: false
mac:
  category: public.app-category.education
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [arm64, x64]
  # Ad-hoc signature: no Apple Developer ID, but a valid bundle seal so Gatekeeper offers "Open Anyway"
  # instead of reporting the app as damaged.
  identity: '-'
  hardenedRuntime: false
  extendInfo:
    NSHumanReadableCopyright: UniOS — your semester, organized.
dmg:
  title: UniOS
  artifactName: UniOS-${version}-${arch}.dmg
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  artifactName: UniOS-Setup-${version}-${arch}.${ext}
linux:
  icon: build/icon.png
  category: Education
  synopsis: Organize your studies — courses, notes, grades and an AI assistant
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: UniOS-${version}-${arch}.${ext}
